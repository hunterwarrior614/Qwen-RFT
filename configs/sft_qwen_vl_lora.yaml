seed: 42
num_train_epochs: 2
data:
  train_file: data/wo_thinking_thyme_single_round-00000-of-00146.qwen_vl_ppo.jsonl
  train_size: 1000
  eval_size: 121
  test_size: 121
  split_seed: 42
  max_train_samples: null
  max_eval_samples: 64
  num_workers: 0
  image_max_longest_edge: 1024
model:
  base_model_name_or_path: ../Qwen/Qwen2.5-VL-3B-Instruct
  sft_adapter_path: null
  torch_dtype: bfloat16
  attn_implementation: sdpa
  gradient_checkpointing: true
  trust_remote_code: false
  use_flash_attention_2: false
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules_regex: .*language_model\\.layers\\.\\d+\\.(self_attn\\.(q_proj|k_proj|v_proj|o_proj)|mlp\\.(gate_proj|up_proj|down_proj))$
optimizer:
  learning_rate: 2.0e-4
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
sft:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 2
  warmup_ratio: 0.03
  max_new_tokens_eval: 8
logging:
  output_dir: outputs/sft/default
  logging_steps: 5
  eval_steps: 25
  save_steps: 50
  save_total_limit: 3
