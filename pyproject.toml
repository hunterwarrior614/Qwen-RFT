[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-vl-rft"
version = "0.1.0"
description = "Qwen2.5-VL LoRA training for visual multiple-choice SFT, PPO, and GRPO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "accelerate==1.13.0",
  "bitsandbytes==0.49.2",
  "matplotlib",
  "numpy",
  "peft==0.19.1",
  "pillow",
  "pyarrow",
  "pyyaml",
  "transformers==4.56.2",
]

[project.scripts]
qwen-vl-sft = "qwen_vl_rl.cli.train_sft:main"
qwen-vl-ppo = "qwen_vl_rl.cli.train_ppo:main"
qwen-vl-grpo = "qwen_vl_rl.cli.train_grpo:main"
qwen-vl-convert-thyme = "qwen_vl_rl.cli.convert_thyme:main"
qwen-vl-plot = "qwen_vl_rl.cli.plot_metrics:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
